services:
  # One web service serving both the React UI and the FastAPI API.
  # Build  = ./Dockerfile (repo-root context, builds the UI then the API)
  # Start  = the Dockerfile CMD (uvicorn, binding Render's $PORT)
  - type: web
    # Name kept as-is so the blueprint sync UPDATES your existing service in
    # place, preserving its URL and dashboard env vars. Renaming it would make
    # Render create a new service (new URL) and drop the old one.
    name: accessibility-auditor-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard          # Free/Starter (512 MB) cannot run headless Chromium
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false         # set in the Render dashboard; never commit it
      - key: ENVIRONMENT
        value: production
      - key: MAX_CONCURRENT_SCANS
        value: "1"          # 2 GB / 1 CPU holds one Chromium comfortably, not two
      - key: SCAN_TIMEOUT_SECONDS
        value: "45"
    # FRONTEND_URL is deliberately absent: the UI is same-origin now, so the
    # CORS allowlist is never consulted.
